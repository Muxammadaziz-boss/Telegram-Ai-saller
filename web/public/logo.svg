<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Clean Base Shape: Modern Rounded Hexagon Shield -->
  <path d="M32 4 L56 16 V38 L32 58 L8 38 V16 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#glow)" />

  <!-- Inner High-Tech Sales AI Circuit Motif -->
  <path d="M32 14 L46 22 V36 L32 48 L18 36 V22 Z" 
        fill="#0f172a" 
        opacity="0.35" />

  <!-- Dynamic AI Spark Core -->
  <path d="M32 18 L36 28 L46 32 L36 36 L32 46 L28 36 L18 32 L28 28 Z" 
        fill="url(#sparkGrad)" />

  <!-- Center Core Node -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />

  <!-- Modern Satellite Nodes -->
  <circle cx="20" cy="22" r="1.5" fill="#bae6fd" />
  <circle cx="44" cy="22" r="1.5" fill="#bae6fd" />
  <circle cx="32" cy="51" r="1.5" fill="#93c5fd" />
</svg>
